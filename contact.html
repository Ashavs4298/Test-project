<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Little Sprout</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#eef1fb;color:#343b58;font-family:system-ui,-apple-system,"Segoe UI",sans-serif} nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;padding:1rem;background:#dfe4f5} nav a{color:#343b58;text-decoration:none;font-weight:650;padding:.65rem 1rem;border-radius:999px} nav a:hover,nav a:focus-visible{background:#fafbff;outline:2px solid #aab6de} main{max-width:720px;margin:auto;padding:2.5rem 1.25rem}.panel{background:#fafbff;border-radius:24px;padding:clamp(1.5rem,5vw,3rem);box-shadow:0 12px 35px #343b5812}h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:0 0 .5rem}p{line-height:1.6}form{display:grid;gap:1rem;margin-top:1.5rem}label{font-weight:650}input,textarea{display:block;width:100%;margin-top:.4rem;padding:.8rem;border:1px solid #bbc5e3;border-radius:10px;background:white;color:#242a42;font:inherit}textarea{min-height:140px;resize:vertical}button{border:0;border-radius:12px;padding:.85rem 1rem;background:#707fb7;color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#59699f}#notice{min-height:1.5rem;font-weight:650}
  </style>
</head>
<body><nav aria-label="Main navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="contact.html">Contact</a><a href="team.html">Team</a><a href="cart.html">Cart</a></nav><main><section class="panel"><h1>Get in touch</h1><p>Have a question about an item or need a hand? Send us a note.</p><form id="contact-form"><label for="name">Your name<input id="name" name="name" autocomplete="name" required></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required></label><label for="message">Message<textarea id="message" name="message" required></textarea></label><button type="submit">Send message</button></form><p id="notice" aria-live="polite"></p></section></main><script>document.querySelector('#contact-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#notice').textContent='Thanks for your message! This demo form is ready, but it does not send data to a server.';event.currentTarget.reset();});</script></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Little Sprout</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7eff8;color:#49364d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;padding:1rem;background:#ecdeef}nav a{color:#49364d;text-decoration:none;font-weight:650;padding:.65rem 1rem;border-radius:999px}nav a:hover,nav a:focus-visible{background:#fffaff;outline:2px solid #c8a9ce}main{max-width:850px;margin:auto;padding:2.5rem 1.25rem}.panel{background:#fffaff;border-radius:24px;padding:clamp(1.5rem,5vw,3rem);box-shadow:0 12px 35px #49364d12}h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:0 0 1rem}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid #eaddec}.row h2{font-size:1.05rem;margin:0 0 .3rem}.row p{margin:0}.qty{display:flex;align-items:center;gap:.5rem}.qty button,.clear{border:0;border-radius:9px;padding:.5rem .7rem;background:#9b78a3;color:white;font:inherit;font-weight:700;cursor:pointer}.total{font-size:1.25rem;font-weight:750;text-align:right;margin-top:1.5rem}#empty{line-height:1.6}.clear{margin-top:1rem;background:#7f6087}
  </style>
</head>
<body><nav aria-label="Main navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="contact.html">Contact</a><a href="team.html">Team</a><a href="cart.html">Cart</a></nav><main><section class="panel"><h1>Your cart</h1><div id="items"></div><p id="empty" hidden>Your cart is empty. <a href="products.html">Browse baby products</a>.</p><p class="total" id="total"></p><button class="clear" id="clear" hidden>Clear cart</button></section></main>
<script>
const products={bear:{name:'Cloud-soft cuddle bear',price:18},bottle:{name:'CalmSip baby bottle',price:12.5},set:{name:'Cozy daywear set',price:26},wraps:{name:'Snuggle muslin wraps',price:22}};
const money=value=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(value);
function render(){const cart=JSON.parse(localStorage.getItem('littleSproutCart')||'{}');const items=document.querySelector('#items');items.replaceChildren();let total=0;let count=0;for(const [id,quantity] of Object.entries(cart)){if(!products[id]||quantity<1)continue;count+=quantity;total+=products[id].price*quantity;const row=document.createElement('article');row.className='row';const info=document.createElement('div');const name=document.createElement('h2');name.textContent=products[id].name;const subtotal=document.createElement('p');subtotal.textContent=money(products[id].price*quantity);info.append(name,subtotal);const controls=document.createElement('div');controls.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Remove one '+products[id].name);minus.onclick=()=>change(id,-1);const qty=document.createElement('span');qty.textContent=quantity;const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Add one '+products[id].name);plus.onclick=()=>change(id,1);controls.append(minus,qty,plus);row.append(info,controls);items.append(row);}document.querySelector('#empty').hidden=count>0;document.querySelector('#total').textContent=count?'Total: '+money(total):'';document.querySelector('#clear').hidden=count===0;}
function change(id,delta){const cart=JSON.parse(localStorage.getItem('littleSproutCart')||'{}');cart[id]=(cart[id]||0)+delta;if(cart[id]<=0)delete cart[id];localStorage.setItem('littleSproutCart',JSON.stringify(cart));render();}
document.querySelector('#clear').onclick=()=>{localStorage.removeItem('littleSproutCart');render();};render();
</script></body>
</html>
